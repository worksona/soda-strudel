open_followups:
- 'Checked via gh api (repo, license, readme, strudel.json, folder listings, commits) plus Freesound licence pages
  for fjpolo''s cited sounds; no audio downloaded, so ''contents'' judgements rest on names and READMEs — a listening
  pass is still advisable. Verdict counts: {''ship-ok'': 3, ''ship-after-owner-check'': 4, ''do-not-ship'': 11,
  ''link-only'': 12}. Strudel''s github: shortcut assumes branch ''main'' — fstiffo/polifonia-samples needs ''/master''.
  Of the 6 open-licence priority banks: 3 ship-ok (AuditeMarlow, fstiffo, hvillase), 2 ship-after-owner-check (emrexdeger:
  no provenance; fjpolo: MIT label over Freesound CC-BY + one CC BY-NC sound), 1 do-not-ship (Veikkosuhonen: Amen
  break, MIT covers code only). QuantumVillage/quantum-music is AGPL too (7th open-licence repo) but its sounds
  come from an OQC video. AustinOliverHaskell''s MIT label is contradicted by its own README (Microsoft copyright).
  Dirt-Samples, which strudel.cc loads by default, fails this policy (no licence, unknown provenance, Amen). Good
  licence-request candidates: Dough-Juj, mysinglelise, wyan, mot4i (confirm CC-BY).'
