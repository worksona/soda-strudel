  in the channel RSS (latest 15); search = found via the channel’s /videos, /shorts, /streams listing pages or YouTube
  search (the schema has no channel-page value). Every item''s watch page was fetched. Strudel filter: title/description/tags
  mention Strudel; for Switch Angel/AngelVision/Maria Areadne, live-coding videos from mid-2023 that do not name
  the tool are kept with strudel_evidence "inferred" (she performs in Strudel) — drop them if strictness matters.
  Switch Angel music videos, album uploads and auto-generated "Switch Angel - Topic" audio were excluded. Genres
  are inferred from titles/descriptions unless noted; kind/level are heuristic from titles. Extra fields: duration,
  strudel_evidence, showcase_title_on_site/youtube_title. Channel resolution: typedbeats is @typedbeats-daily (@typedbeats
  404s); Wave Coder is @WaveCodr (@WaveCoder/@wavecoder resolve to an empty "wavecode" channel); Iganu music is
  UCY7tXqRgSZS0eemuhMUT6LA (@IganuMusic resolves to an empty different channel); Creative Code Art is @Creativecodeartcommunity
  (@CreativeCodeArt resolves to "Algorist"). Eulerroom coverage is partial: the channel has thousands of uploads;
  Strudel sets were found via channel search "strudel", RSS and YouTube search, so older solstice/TOPLAP sets that
