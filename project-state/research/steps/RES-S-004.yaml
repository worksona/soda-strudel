open_followups:
- 'Method: gh repo and code search (setcpm/@license/@by/@genre plus --filename genre terms), the Codeberg API (the
  HTML explore page serves junk to scrapers), the uzu.lurk.org forum search (little yield), and Strudel docs and
  showcase sources. WebFetch hit a session limit, so pages were read with curl and the gh API. Every item URL''s
  file was opened through the API or raw endpoints. Only headers were read, to get title, author, licence and genre;
  no code is reproduced here. Excluded: AI-generated corpora (A5TA/strudel-agents, imMatheus/daij, LeoYeAI, nukleas/cycletron),
  stock-tune copies (Bulka, godot-strudel, vscode forks), covers (achmad-miftahurrojak REDRED_CORTIS = CORTIS cover;
  Bulka gallery covers), and Switch-Angel-derived files (fjpolo). Licence pattern: explicit licences are rare, and
  most are NC (BY-NC-SA). Only fcm (CC BY-SA 4.0) and Threadbare (CC BY-SA 4.0) allow commercial reuse. Leads not
  followed up: WilliamOpenshaw generative repo, frenata/music compositions, jacksonchen666/random-strudel-bits (AGPL,
  pastagang shortcuts), the Strudel Discord.'
