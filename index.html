<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>soda.strudel</title>
    <meta name="description" content="Live-code music, images, camera and story in your browser. Built on Strudel." />
    <meta name="theme-color" content="#0b0b12" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body data-mode="code">
    <header id="toolbar" role="toolbar" aria-label="soda.strudel">
      <button id="brand" class="brand" data-page="about" title="About soda.strudel">soda.strudel</button>
      <button id="play" class="primary" data-icon="play" aria-pressed="false" title="Play / update (ctrl+enter) · Stop (ctrl+.)"><span class="label">Play</span></button>
      <div id="modes" class="segmented" role="group" aria-label="View">
        <button data-mode="code" data-icon="code" aria-pressed="true" title="Code over the stage" aria-label="Code"></button>
        <button data-mode="stage" data-icon="stage" aria-pressed="false" title="Stage only" aria-label="Stage"></button>
        <button data-mode="full" data-icon="full" title="Full screen" aria-label="Full screen"></button>
      </div>
      <div class="group" role="group" aria-label="Inputs">
        <button id="mic" class="icon-btn" data-icon="mic" title="Record a take from the microphone" aria-label="Record a take"></button>
        <button id="camera" class="icon-btn" data-icon="camera" title="Camera on / off (stays on this device)" aria-label="Camera" aria-pressed="false"></button>
        <button id="flip" class="icon-btn" data-icon="flip" title="Switch camera" aria-label="Switch camera" hidden></button>
      </div>
      <span class="spacer"></span>
      <nav class="group pages" aria-label="Pages">
        <button class="icon-btn" data-page="sketches" data-icon="sketches" title="Sketches" aria-label="Sketches"></button>
        <button class="icon-btn" data-page="examples" data-icon="examples" title="Examples" aria-label="Examples"></button>
        <button class="icon-btn" data-page="sounds" data-icon="sounds" title="Sounds" aria-label="Sounds"></button>
        <button class="icon-btn" data-page="media" data-icon="media" title="Media" aria-label="Media"></button>
        <button class="icon-btn" data-page="reference" data-icon="reference" title="Reference" aria-label="Reference"></button>
      </nav>
      <div class="group actions" role="group" aria-label="Share and export">
        <button id="export" class="icon-btn" data-page="export" data-icon="download" title="Export video, audio or a .soda file" aria-label="Export"></button>
        <button id="share" class="icon-btn" data-page="share" data-icon="share" title="Copy a link" aria-label="Share"></button>
        <button id="claude" class="icon-btn" data-icon="claude" title="Copy this sketch for Claude" aria-label="Claude"></button>
      </div>
      <div class="group pages" role="group" aria-label="About and settings">
        <button class="icon-btn" data-page="about" data-icon="about" title="About and help" aria-label="About"></button>
        <button class="icon-btn" data-page="settings" data-icon="settings" title="Settings" aria-label="Settings"></button>
      </div>
      <button id="more" class="icon-btn" data-page="more" data-icon="more" title="Pages" aria-label="Pages"></button>
    </header>

    <main id="main">
      <div id="stage" aria-label="Stage"></div>
      <div id="editor"></div>
      <div id="error" role="status" hidden></div>
    </main>

    <aside id="panel" hidden aria-labelledby="panel-title">
      <div class="drawer-head"><h2 id="panel-title">Sketches</h2><button id="panel-close" class="icon" data-icon="close" aria-label="Close"></button></div>
      <div class="drawer-body"></div>
    </aside>

    <div id="viewer-controls" aria-label="Viewer controls">
      <button id="viewer-full" data-icon="full" aria-label="Full screen"></button>
      <button id="remix" data-icon="code" title="Open the code"><span class="label">Remix</span></button>
    </div>
    <div id="title-card" hidden></div>
    <input id="file-open" type="file" accept=".soda,application/zip" multiple hidden />
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="drop-hint" aria-hidden="true">Drop sounds, images, video or .soda files</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
